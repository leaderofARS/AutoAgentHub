[project]
name = "autoagenthub"
version = "0.1.0"
description = "24/7 cloud-ready multi-agent hub triggered by Telegram/WhatsApp with GitHub, News, Jobs, and MCP server support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.2",
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.7",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
autoagenthub-server = "autoagenthub.server:main"
autoagenthub-mcp = "autoagenthub.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoagenthub"]
